<script>
  document.getElementById('analyseIncidents').addEventListener('change', function() {
    var selectedOption = this.value;

    var actions = document.getElementById('actions');
    var communicationContent = document.getElementById('communicationContent');

    communicationClients.style.display = 'none';
    actions.style.display = 'none';

       if (selectedOption === '1') {
      communicationClients.style.display = 'block';
      document.getElementById('communicationContent').innerHTML = "<p>Avant de traiter un ticket, rend toi dans «Synthèse activité» pour vérifier qu'il ne s'agit pas d'un ticket en :</p><p>- Retour JIRA,<br>- Réouverture d'un autre technicien,<br>- SAD (suite à donner),<br>- Que le client ne fasse pas partie d'une instance/OPSN (visible dans la fiche collectivité).<br><br>Le client indique que la demande fait suite à un autre ticket ? Recherche le ou les tickets pour cerner la demande du client. pas de réaffectation de ticket au technicien d'origine.</p>";

    } else if (selectedOption === '2') {
      communicationClients.style.display = 'block';
      document.getElementById('communicationContent').innerHTML = "<p>Pense à bien contextualiser ta problématique :</p><p>⚠️ Attention : en cas de doute demande uniquement à ton référent. Sollicite les coordinateurs, mais avec l’accord du référent.</p><p>➜ Client en monoposte, en réseau, en TSE ou en cloud ?<br>➜ Si réseau : le problème est-il reproduit sur un autre poste ?<br>➜ Quel est le logiciel concerné et sa version actuelle ?<br>➜ Indique-nous la liste des manipulations effectuées et le résultat obtenu.(Exemple : redémarrage service agent > nok message xx)</p>";

    } else if (selectedOption === '3') {
      communicationClients.style.display = 'block';
      document.getElementById('communicationContent').innerHTML = "<p>Pense à bien contextualiser ta problématique :</p><p>⚠️ Attention : en cas de doute demande uniquement à ton référent. Sollicite les coordinateurs, mais avec l’accord du référent</p><p>➜ Quel est le logiciel concerné et sa version actuelle ?<br>➜ Précise le message d'erreur (avec le détail) et : à quel moment tu le rencontres, où tu es dans le logiciel, les manipulations qui aboutissent à l'erreur.<br>➜ Indique-nous la liste des manipulations effectuées et le résultat obtenu (exemple : maintenance XX -> nok),<br>➜ Le problème est-il reproduit sur un autre poste ou sur ton poste (avec ta base ou leur base) ? En fonction de la problématique client<br>➜ Où as-tu cherché (BL API, JIRA...).</p>";

    } else if (selectedOption === '4') {
      communicationClients.style.display = 'block';
      document.getElementById('communicationContent').innerHTML = "<p>Faire valider ton texte à ton référent et aide-toi du site PMC pour la rédiger correctement.</p><p>⚠️ Une fois la JIRA créée, tu dois communiquer le n° à ton référent (afin qu’on puisse la suivre avec toi).</p>";

	} else if (selectedOption === '5') {
      communicationClients.style.display = 'block';
      document.getElementById('communicationContent').innerHTML = "<p>Pense à faire valider ton écrit</p><p>⚠️ Dans la zone « observateur » tu dois mentionner ton référent afin qu'il puisse le suivre avec toi</p>";

	} else if (selectedOption === '6') {
      communicationClients.style.display = 'block';
      document.getElementById('communicationContent').innerHTML = "<p><strong><u>Informations à fournir au référent :</u></strong></p><p>- N° du cloud (citrix ou Ras)<br>- Nom du produit : composé du logiciel + la version+ le nom de la collectivité + n° département. Exemple : Gestion financière - v 20.30.00.09 - [BERGER LEVRAULT 72 GF]<br>- Si pas d'accès au logiciel, informer le référent et fournir le bandeau client disponible sur Salesforce</p><p>Ton référent te donnera le lien de téléchargement FTP, pour mettre la base dans le dossier BDD Client que tu auras créé</p>";

	} else if (selectedOption === '7') {
      communicationClients.style.display = 'block';
      document.getElementById('communicationContent').innerHTML = "<p><strong><u>Informations à fournir au référent :</u></strong></p><p>- N° du cloud (citrix ou Ras)<br>- Nom du produit : composé du logiciel + la version+ le nom de la collectivité + n° département. Exemple : Gestion financière - v 20.30.00.09 - [BERGER LEVRAULT 72 GF]<br>- Si pas d'accès au logiciel, informer le référent et fournir le bandeau client disponible sur Salesforce</p><p>Le référent fournira le nom du produit complet avec l’ID produit à indiquer dans le  <a href='https://berger-levrault.atlassian.net/servicedesk/customer/portal/1' target='_blank'>ticket BL Hébergement</a></p>";

	} else if (selectedOption === '8') {
      communicationClients.style.display = 'block';
      document.getElementById('communicationContent').innerHTML = "<p><strong><u>Informations à fournir au référent :</u></strong></p><p>- N° du cloud (citrix ou Ras)<br>- Nom du produit : composé du logiciel + la version+ le nom de la collectivité + n° département. Exemple : Gestion financière - v 20.30.00.09 - [BERGER LEVRAULT 72 GF]<br>- Si pas d'accès au logiciel, informer le référent et fournir le bandeau client disponible sur Salesforce<br>- La JIRA, la BL.API... qui mentionne la version à appliquer</p>";

      communicationClients.style.display = 'block';
      document.getElementById('communicationContent').innerHTML = "<p><p><strong><u>Informations à fournir au référent :</u></strong></p><p>- N° du cloud (citrix ou Ras)<br>- Nom du produit : composé du logiciel + la version+ le nom de la collectivité + n° département. Exemple : Gestion financière - v 20.30.00.09 - [BERGER LEVRAULT 72 GF]<br>- Si pas d'accès au logiciel, informer le référent et fournir le bandeau client disponible sur Salesforce<br>- La communication, la BL.API... qui mentionne la version à appliquer</p>";

	} else if (selectedOption === '10') {
      communicationClients.style.display = 'block';

	} else if (selectedOption === '11') {
      communicationClients.style.display = 'block';

	} else if (selectedOption === '12') {

	}
