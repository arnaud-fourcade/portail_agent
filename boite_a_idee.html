<title>Boîte à idée</title>
<link rel="stylesheet" href="../Page_communes/style.css">
	<style>

  body {
    font-family: "Century Gothic", sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f2f2f2;
  }
	  /* Style pour l'image principale */
	  #main-image {
		width: 20%;
		height: 20%;
	  }

	  /* Style pour la boîte à idées */
	  .idea-box {
		margin-left: 300px;
		padding: 20px;
		background-color: white;
		border-radius: 10px;
		box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
		text-align: center;
		max-width: 500px;
	  }

	  .idea-box h2 {
		color: #372E95;
	  }

	  .idea-box textarea {
		width: 90%;
		height: 100px;
		padding: 10px;
		border: 1px solid #ccc;
		border-radius: 5px;
		resize: none;
		font-size: 14px;
	  }

	  .idea-box button {
		margin-top: 10px;
		padding: 10px 15px;
		background-color: #372E95;
		color: white;
		border: none;
		border-radius: 5px;
		cursor: pointer;
		font-size: 16px;
	  }

	  .idea-box button:hover {
		background-color: #2A2478;
	  }
	</style>
</head>
<body>

	<!-- Bandeau latéral -->
	<iframe src="../menu/sidebar_2.html" style="width: 280px; height: 100vh; border: none; position: fixed; top: 0; left: 0;"></iframe>

	<!-- Contenu principal -->
	<div style="margin-left: 300px; padding: 20px;">
	  <img id="main-image" src="../Images/Image1.png" alt="Actualités">
	</div>

	<!-- Boîte à idées -->
	<div class="idea-box">
	  <h2>💡 Boîte à idées</h2>
	  <p>Une suggestion pour améliorer le site ? Partage ton idée !</p>
	  <textarea id="idea-text" placeholder="Décris ton idée ici..."></textarea>
	  <button onclick="sendIdea()">Envoyer</button>
	</div>

	<script>
	  function sendIdea() {
		let idea = document.getElementById("idea-text").value;
		if (idea.trim() === "") {
		  alert("Merci de remplir le champ avant d'envoyer !");
		  return;
		}
		
		let email = "laetitia.feraut@berger-levrault.com";
		let ccEmail = "arnaud.fourcade@berger-levrault.com";
		let subject = encodeURIComponent("Suggestion d'amélioration du site");
		let body = encodeURIComponent("Bonjour,\n\nVoici une idée pour améliorer le site :\n\n" + idea + "\n\nMerci !");
		
		window.location.href = `mailto:${email}?cc=${ccEmail}&subject=${subject}&body=${body}`;
	  }
	  

    // tracking
	
  fetch('http://10.31.210.23:8450/log', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({
    page: window.location.pathname.split('/').pop()
  })
});
	  
	</script>

</body>
