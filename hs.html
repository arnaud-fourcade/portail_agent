<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BL Twist Days</title>
<style>
  body {
    font-family: "Century Gothic", sans-serif;
    margin: 0; /* Supprimer les marges par défaut du corps de la page */
    padding: 0; /* Supprimer les espacements internes par défaut */
    background-color: #f2f2f2; /* Couleur de fond de la page */
  }

  /* Style pour l'image principale */
  #main-image {
    width: 100%; /* Redimensionner l'image à % de sa taille d'origine */
    height: auto;
  }
</style>
</head>
<body>


<!-- Menu -->
  <iframe src="../menu/sidebar_2.html?page=Twist Days" style="width: 280px; height: 100vh; border: none; position: fixed; top: 0; left: 0;"></iframe>

<!-- Contenu principal -->
<div style="margin-left: 300px; padding: 20px;">

  <p>
  <!-- Conteneur de secours pour Firefox -->
  <div id="forms-container">
    <iframe id="forms-iframe"
      width="1280px"
      height="1280px"
      src="https://forms.office.com/e/5sPRnRS1Dj"
      frameborder="0"
      marginwidth="0"
      marginheight="0"
      style="border: none; max-width:100%; max-height:100vh;"
      allowfullscreen webkitallowfullscreen mozallowfullscreen msallowfullscreen>
    </iframe>
  </div>
</div>

<script>
  // Détection simple du navigateur Firefox
  const isFirefox = navigator.userAgent.toLowerCase().includes('firefox');

  if (isFirefox) {
    // URL de ton formulaire
    const formUrl = "https://forms.office.com/e/5sPRnRS1Dj";
    
    // Ouvre le formulaire dans un nouvel onglet
    window.open(formUrl, '_blank', 'noopener,noreferrer');
    
    // Affiche un message à la place de l'iframe
    const container = document.getElementById('forms-container');
    container.innerHTML = `
      <p style="font-family: sans-serif; padding: 1rem;">
        ⚠️ Votre navigateur (Firefox) empêche l’affichage direct du formulaire.
        <a href="${formUrl}" target="_blank" rel="noopener noreferrer">Cliquez ici pour l’ouvrir dans un nouvel onglet</a>.
      </p>
    `;
  }
</script>


<script>
    // tracking
	
  fetch('http://10.31.210.23:8450/log', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({
    page: window.location.pathname.split('/').pop()
  })
});
</script>

</body>
</html>
