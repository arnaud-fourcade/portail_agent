  <meta charset="utf-8" />
  <title>Maquettes budgétaires</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root{
      /* Couleurs principales */
      --primary: #372E95;
      --accent: #FFD040;

      /* Couleurs secondaires */
      --secondary-1: #776ED2;
      --secondary-2: #4438B7;
      --secondary-3: #29226F;
      --secondary-4: #D1CEF0;

      --bg: #f6f7fb;
      --text-dark: #1f1f2e;
      --radius: 14px;

      /* Largeur du menu */
      --menu-width: 280px;
    }

    body {
      margin: 0;
      font-family: "Century Gothic", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, var(--secondary-4), #ffffff);
      color: var(--text-dark);
    }

    /* Conteneur principal centré dans l’espace restant après le menu */
    .container {
      max-width: 1200px;

      margin-top: 40px;

      /* Décalage par rapport au menu */
      margin-left: calc(var(--menu-width) + 180px);

      /* Centrage dans la largeur restante */
      width: calc(100% - var(--menu-width));
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 24px 0;
      font-size: 36px;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--primary);
    }

    .card {
      background: #ffffff;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(55, 46, 149, 0.15);
      border: 1px solid var(--secondary-4);
    }

    /* Bandeau d’information */
    .hint {
      padding: 14px 18px;
      background: linear-gradient(90deg, var(--primary), var(--secondary-2));
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 16x;
      padding: 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--secondary-4);
      align-items: flex-end;
    }

    .field {
      flex: 1 1 260px;
    }

    .field label {
      font-size: 13px;
      color: var(--secondary-3);
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    select {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--secondary-4);
      background: #ffffff;
      font-size: 14px;
      transition: all 0.2s ease;
      outline: none;
    }

    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(55, 46, 149, 0.15);
    }

    button {
      height: 42px;
      padding: 0 24px;
	  margin-left: 16px; /* espace à gauche du bouton */
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--secondary-2));
      color: #ffffff;
      cursor: pointer;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 700;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 6px 14px rgba(55, 46, 149, 0.25);
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
      box-shadow: 0 8px 18px rgba(55, 46, 149, 0.35);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 4px 10px rgba(55, 46, 149, 0.25);
    }

    iframe#viewer {
      width: 100%;
      height: 75vh;
      border: none;
      background: #ffffff;
    }

    /* Responsive */
    @media (max-width: 720px) {
      .container {
        margin-left: 0;
        width: 100%;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      button {
        width: 100%;
        background: linear-gradient(135deg, var(--accent), #ffb800);
        color: var(--secondary-3);
      }
    }
  </style>
</head>

<body>

  <!-- Menu -->
  <iframe 
    src="../menu/sidebar_2.html?page=memo_1"
    style="
      width: var(--menu-width);
      height: 100vh;
      border: none;
      position: fixed;
      top: 0;
      left: 0;
    ">
  </iframe>

  <!-- Contenu principal -->
  <div class="container">
    <h1>Maquettes budgétaires</h1>

    <div class="card">
      <div class="hint">
        Sélectionnez une année et une norme, puis cliquez sur <strong>Afficher</strong> pour charger le plan de comptes.
      </div>

      <div class="toolbar">
        <div class="field">
          <label for="yearSelect">Année</label>
          <select id="yearSelect"></select>
        </div>

        <div class="field">
          <label for="normeSelect">Norme</label>
          <select id="normeSelect"></select>
        </div>

        <button id="btnShow">Afficher</button>
      </div>

      <iframe id="viewer" title="Norme comptable"></iframe>
    </div>
  </div>

  <script>
    const BASE = "http://odm-budgetaire.org/composants/normes";

    const NORMES = [
      { label: "M14 CCAS INF3500", path: "M14/M14_CCAS_INF3500" },
      { label: "M14 CCAS SUP 3500", path: "M14/M14_CCAS_SUP3500" },
      { label: "M14 CE",            path: "M14/M14_CE" },
      { label: "M14 COM 500 3500",  path: "M14/M14_COM_500_3500" },
      { label: "M14 COM INF500",    path: "M14/M14_COM_INF500" },
      { label: "M14 COM SUP 3500",  path: "M14/M14_COM_SUP3500" },
      { label: "M4",                path: "M4/M4" },
      { label: "M41",               path: "M4/M41" },
      { label: "M43",               path: "M4/M43" },
      { label: "M49 Simplifié",     path: "M4/M49_A" },
      { label: "M49 Développé",     path: "M4/M49_D" },
      { label: "M52",               path: "M52/M52" },
      { label: "M57 Simplifié",     path: "M57/M57_A" },
      { label: "M57 Développé",     path: "M57/M57_D" },
      { label: "M61",               path: "M61/M61" },
      { label: "M71",               path: "M71/M71" }
    ];

    const yearSelect  = document.getElementById("yearSelect");
    const normeSelect = document.getElementById("normeSelect");
    const btnShow     = document.getElementById("btnShow");
    const viewer      = document.getElementById("viewer");

    function buildUrl(year, path) {
      return `${BASE}/${year}/${path}/planDeCompte.xml`;
    }

    function showNorme() {
      viewer.src = buildUrl(yearSelect.value, normeSelect.value);
    }

    // Années
    const CURRENT_YEAR = new Date().getFullYear();
    const START_YEAR = 2024;

    for (let y = CURRENT_YEAR; y >= START_YEAR; y--) {
      const opt = document.createElement("option");
      opt.value = y;
      opt.textContent = y;
      if (y === CURRENT_YEAR) opt.selected = true;
      yearSelect.appendChild(opt);
    }

    // Normes
    NORMES.forEach(n => {
      const opt = document.createElement("option");
      opt.value = n.path;
      opt.textContent = n.label;
      normeSelect.appendChild(opt);
    });

    btnShow.addEventListener("click", showNorme);

    // Chargement automatique
    showNorme();
  </script>
</body>
</html>
